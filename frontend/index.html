<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Headless Drupal Blog</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; color: #1a1a2e; }

    header { background: #0073b6; color: white; padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header span { font-size: 13px; opacity: 0.85; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; }

    .container { max-width: 1100px; margin: 2.5rem auto; padding: 0 1.5rem; }

    .page-title { font-size: 1.1rem; color: #555; margin-bottom: 1.5rem; }
    .page-title strong { color: #0073b6; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }

    .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.07); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border-top: 4px solid #0073b6; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .card-meta { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .card h2 { font-size: 1.1rem; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; line-height: 1.35; }
    .card p { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 1rem; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .author { font-size: 12px; color: #0073b6; font-weight: 600; }
    .read-more { font-size: 12px; color: #0073b6; font-weight: 600; }

    .single { background: white; border-radius: 12px; padding: 2.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.07); max-width: 760px; margin: 0 auto; }
    .single h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 1rem; line-height: 1.3; }
    .single-meta { font-size: 13px; color: #888; margin-bottom: 1.5rem; display: flex; gap: 1rem; }
    .single-meta span { display: flex; align-items: center; gap: 4px; }
    .single-body { font-size: 16px; line-height: 1.8; color: #333; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 1.5rem; color: #0073b6; font-weight: 600; cursor: pointer; font-size: 14px; background: none; border: none; padding: 0; }
    .back-btn:hover { text-decoration: underline; }

    .loading { text-align: center; padding: 4rem; color: #888; font-size: 16px; }
    .tag { display: inline-block; background: #e6f1fb; color: #0073b6; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; margin-right: 6px; }

    .api-badge { background: #1a1a2e; color: #00d4aa; font-family: monospace; font-size: 11px; padding: 6px 14px; border-radius: 6px; margin-bottom: 1.5rem; display: inline-block; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const API = 'https://headless-drupal-blog.ddev.site/jsonapi/node/blog_post?sort=-created&fields[node--blog_post]=title,field_blog_summary,field_blog_author,body,created';

    function formatDate(str) {
      return new Date(str).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function BlogList({ posts, onSelect }) {
      return (
        <div className="container">
          <div className="api-badge">⚡ Powered by Drupal 11 JSON:API → https://headless-drupal-blog.ddev.site/jsonapi</div>
          <p className="page-title">Showing <strong>{posts.length} posts</strong> fetched live from Drupal JSON:API</p>
          <div className="grid">
            {posts.map(post => {
              const a = post.attributes;
              return (
                <div className="card" key={post.id} onClick={() => onSelect(post)}>
                  <div className="card-meta">📅 {formatDate(a.created)}</div>
                  <h2>{a.title}</h2>
                  <p>{a.field_blog_summary}</p>
                  <div className="card-footer">
                    <span className="author">✍ {a.field_blog_author}</span>
                    <span className="read-more">Read more →</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function BlogPost({ post, onBack }) {
      const a = post.attributes;
      return (
        <div className="container">
          <button className="back-btn" onClick={onBack}>← Back to all posts</button>
          <div className="single">
            <h1>{a.title}</h1>
            <div className="single-meta">
              <span>✍ {a.field_blog_author}</span>
              <span>📅 {formatDate(a.created)}</span>
            </div>
            <div className="single-body" dangerouslySetInnerHTML={{__html: a.body?.processed || a.field_blog_summary}} />
          </div>
        </div>
      );
    }

    function App() {
      const [posts, setPosts] = React.useState([]);
      const [selected, setSelected] = React.useState(null);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        fetch(API)
          .then(r => r.json())
          .then(d => { setPosts(d.data || []); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      return (
        <div>
          <header>
            <h1>📝 Headless Drupal Blog</h1>
            <span>Drupal 11 + JSON:API + React</span>
          </header>
          {loading
            ? <div className="loading">⏳ Fetching posts from Drupal JSON:API...</div>
            : selected
              ? <BlogPost post={selected} onBack={() => setSelected(null)} />
              : <BlogList posts={posts} onSelect={setSelected} />
          }
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
